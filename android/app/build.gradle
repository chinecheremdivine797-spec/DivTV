plugins { id 'com.android.application' }

android {
    namespace 'ng.divstudio.divtv'
    compileSdk 35
    defaultConfig {
        applicationId 'ng.divstudio.divtv'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
