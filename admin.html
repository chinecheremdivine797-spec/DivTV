<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIV TV Studio Admin</title><link rel="stylesheet" href="styles.css"></head><body><main class="section" style="max-width:1100px"><div class="section-head"><div><p class="eyebrow">DIVSTUDIO.CO LTD</p><h2>DIV TV Studio</h2><p class="muted">Private publishing and content control center.</p></div><a class="secondary" href="index.html">← Public TV</a></div><div id="login" class="panel"><p class="eyebrow">ADMIN ACCESS</p><h2>Studio sign in</h2><p class="muted">Only the authorized DIVSTUDIO admin account can publish content.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="primary full" id="loginBtn">Sign in</button><p id="loginMsg" class="muted"></p></div><div id="dashboard" class="hidden"><div class="series-grid" id="stats"></div><section class="panel" style="margin-top:20px"><p class="eyebrow">PUBLISH</p><h2>Upload a new video</h2><div class="form-grid"><input id="title" placeholder="Video title"><input id="category" placeholder="Category (Animation, Film, etc.)"><input id="description" placeholder="Description"><input id="tags" placeholder="Tags, comma separated"><input id="episode" type="number" placeholder="Episode number"><select id="status"><option value="published">Publish now</option><option value="draft">Save draft</option><option value="scheduled">Schedule</option></select><input id="scheduled" type="datetime-local"><input id="video" type="file" accept="video/mp4,video/webm,video/quicktime"><input id="thumbnail" type="file" accept="image/*"></div><button class="primary" id="publishBtn">Upload & publish</button><p id="publishMsg" class="muted"></p></section><section class="panel" style="margin-top:20px"><p class="eyebrow">CONTENT</p><h2>Published & draft library</h2><div id="contentList"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
